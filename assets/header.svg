<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="ummpa — frontend developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F1A"/>
      <stop offset="100%" stop-color="#16382D"/>
    </linearGradient>
    <radialGradient id="glow" cx="81%" cy="55%" r="32%">
      <stop offset="0%" stop-color="#E9D8A6" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#E9D8A6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      .mono  { font: 400 19px Consolas, 'SFMono-Regular', Menlo, 'D2Coding', monospace; }
      .bar   { font: 400 13px Consolas, 'SFMono-Regular', Menlo, monospace; fill: #7FA595; letter-spacing: 1px; }
      .p     { fill: #D4B36A; }
      .cmd   { fill: #F4EFE3; }
      .out   { fill: #9FCFB4; }
      .str   { fill: #E79A8B; }
      .l     { animation: show .5s ease-out both; }
      .l2 { animation-delay: .7s } .l3 { animation-delay: 1.5s } .l4 { animation-delay: 2.2s } .l5 { animation-delay: 3s }
      .cur   { fill: #F4EFE3; animation: blink 1.1s steps(1) infinite; }
      .tree  { fill: #21503F; }
      .tree2 { fill: #1A4032; }
      .gold  { fill: #D4B36A; }
      .lt    { animation: tw 2.4s ease-in-out infinite; }
      .d2 { animation-delay: .8s } .d3 { animation-delay: 1.6s }
      .snow  { fill: #FFFFFF; animation: fall linear infinite; }
      @keyframes show  { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes tw    { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes fall  { from { transform: translateY(-30px) } to { transform: translateY(370px) } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#sky)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- trees -->
    <path class="tree2" d="M70 262 l34 -52 h-14 l26 -40 h-12 l24 -40 24 40 h-12 l26 40 h-14 l34 52z" transform="translate(772 150) scale(.6)"/>
    <path class="tree2" d="M70 262 l34 -52 h-14 l26 -40 h-12 l24 -40 24 40 h-12 l26 40 h-14 l34 52z" transform="translate(1030 96) scale(.8)"/>
    <path class="tree"  d="M70 262 l34 -52 h-14 l26 -40 h-12 l24 -40 24 40 h-12 l26 40 h-14 l34 52z" transform="translate(788 -88) scale(1.5)"/>
    <path class="gold lt" d="M980 91 l3.6 8.4 9 .8 -6.8 6 2 8.8 -7.8 -4.6 -7.8 4.6 2 -8.8 -6.8 -6 9 -.8z"/>

    <!-- tree lights -->
    <g>
      <circle class="lt"    cx="974"  cy="149" r="3.2" fill="#D4B36A"/>
      <circle class="lt d2" cx="995"  cy="161" r="3.2" fill="#E79A8B"/>
      <circle class="lt d3" cx="956"  cy="206" r="3.2" fill="#F4EFE3"/>
      <circle class="lt"    cx="986"  cy="197" r="3.2" fill="#E79A8B"/>
      <circle class="lt d2" cx="1013" cy="215" r="3.2" fill="#D4B36A"/>
      <circle class="lt d3" cx="938"  cy="272" r="3.2" fill="#D4B36A"/>
      <circle class="lt d2" cx="971"  cy="260" r="3.2" fill="#F4EFE3"/>
      <circle class="lt"    cx="1007" cy="278" r="3.2" fill="#E79A8B"/>
      <circle class="lt d3" cx="1037" cy="266" r="3.2" fill="#D4B36A"/>
    </g>

    <!-- snowy ground -->
    <path d="M0 304 C 200 284, 420 316, 620 300 S 1000 284, 1200 302 V 340 H 0 Z" fill="#F4EFE3" opacity=".10"/>
    <path d="M0 320 C 240 302, 460 330, 700 316 S 1040 304, 1200 320 V 340 H 0 Z" fill="#F4EFE3" opacity=".16"/>

    <!-- terminal -->
    <g>
      <rect x="80" y="48" width="670" height="236" rx="14" fill="#07130F" opacity=".82"/>
      <rect x="80.5" y="48.5" width="669" height="235" rx="13.5" fill="none" stroke="#F4EFE3" stroke-opacity=".14"/>
      <line x1="80" y1="86" x2="750" y2="86" stroke="#F4EFE3" stroke-opacity=".10"/>
      <circle cx="106" cy="67" r="6" fill="#E0766A"/>
      <circle cx="126" cy="67" r="6" fill="#D4B36A"/>
      <circle cx="146" cy="67" r="6" fill="#5FA882"/>
      <text class="bar" x="415" y="72" text-anchor="middle">ummpa — zsh</text>

      <text class="mono l"    x="108" y="124"><tspan class="p">$ </tspan><tspan class="cmd">whoami</tspan></text>
      <text class="mono l l2" x="108" y="154"><tspan class="out">ummpa — frontend developer</tspan></text>
      <text class="mono l l3" x="108" y="192"><tspan class="p">$ </tspan><tspan class="cmd">cat about.txt</tspan></text>
      <text class="mono l l4" x="108" y="222"><tspan class="out">안녕하세요, 어서오세요, 좋은 하루입니다</tspan></text>
      <text class="mono l l5" x="108" y="260"><tspan class="p">$ </tspan><tspan class="cmd">git commit -m </tspan><tspan class="str">"merry christmas"</tspan><tspan class="cur"> _</tspan></text>
    </g>

    <!-- snow -->
    <g>
      <circle class="snow" cx="40"   r="2.2" opacity=".8" style="animation-duration:11s;animation-delay:-2s"/>
      <circle class="snow" cx="170"  r="1.4" opacity=".5" style="animation-duration:15s;animation-delay:-9s"/>
      <circle class="snow" cx="300"  r="1.3" opacity=".4" style="animation-duration:16s;animation-delay:-12s"/>
      <circle class="snow" cx="520"  r="1.3" opacity=".4" style="animation-duration:17s;animation-delay:-5s"/>
      <circle class="snow" cx="700"  r="1.4" opacity=".4" style="animation-duration:14s;animation-delay:-1s"/>
      <circle class="snow" cx="790"  r="2"   opacity=".8" style="animation-duration:12s;animation-delay:-7s"/>
      <circle class="snow" cx="850"  r="1.5" opacity=".6" style="animation-duration:15s;animation-delay:-4s"/>
      <circle class="snow" cx="905"  r="2.5" opacity=".8" style="animation-duration:9.5s;animation-delay:-1.5s"/>
      <circle class="snow" cx="960"  r="1.4" opacity=".6" style="animation-duration:14s;animation-delay:-10s"/>
      <circle class="snow" cx="1030" r="2"   opacity=".7" style="animation-duration:12s;animation-delay:-5.5s"/>
      <circle class="snow" cx="1085" r="1.3" opacity=".6" style="animation-duration:16s;animation-delay:-2.5s"/>
      <circle class="snow" cx="1140" r="2.3" opacity=".8" style="animation-duration:10.5s;animation-delay:-8.5s"/>
      <circle class="snow" cx="1178" r="1.5" opacity=".6" style="animation-duration:13s;animation-delay:-11s"/>
    </g>
  </g>
</svg>
